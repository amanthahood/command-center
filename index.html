<style>
@import url('https://api.fontshare.com/v2/css?f[]=gopher@300,400,500,700&display=swap');
:root{
  --cream:#f5f0e8;--gold:#c9a84c;--gold-light:#e2c97e;--gold-dark:#8b6914;
  --dark:#1a1208;--dark2:#251c0d;--dark3:#2f2210;
  --muted:#b8a878;--border:rgba(201,168,76,.22);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Gopher',sans-serif;background:var(--dark);color:var(--cream);overflow:hidden;}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#splash.hide{display:none;}
#splash img{width:108px;height:108px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;box-shadow:0 0 28px rgba(201,168,76,.35);}
#splash h1{font-size:26px;font-weight:400;letter-spacing:5px;}
#splash p{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
#pin-dots{display:flex;gap:12px;}
.pd{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--gold);transition:background .15s;}
.pd.on{background:var(--gold);}
#pin-err{height:14px;font-size:10px;color:#e07070;letter-spacing:1px;text-align:center;}
#pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:216px;}
.pb{height:54px;border-radius:12px;background:var(--dark2);border:1px solid var(--border);color:var(--cream);font-size:20px;font-weight:300;cursor:pointer;transition:all .15s;font-family:'Gopher',sans-serif;}
.pb:hover{border-color:var(--gold);background:var(--dark3);}
.pb:active{transform:scale(.94);}

/* APP */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* TOPBAR */
#topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;background:var(--dark2);border-bottom:1px solid var(--border);padding:0 18px;height:58px;}
#tb-avatar{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);object-fit:cover;cursor:pointer;flex-shrink:0;}
#tb-title{font-size:17px;letter-spacing:3px;color:var(--gold-light);flex:1;font-weight:400;}
#tb-date{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
#tb-claude{background:linear-gradient(135deg,var(--gold-dark),var(--gold));border:none;border-radius:20px;padding:6px 14px;color:var(--dark);font-size:9px;font-weight:600;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;white-space:nowrap;font-family:'Gopher',sans-serif;}

/* SECTION NAV */
#snav{flex-shrink:0;display:flex;background:var(--dark2);border-bottom:1px solid var(--border);overflow-x:auto;padding:0 8px;}
#snav::-webkit-scrollbar{height:0;}
.sb{flex-shrink:0;padding:14px 16px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Gopher',sans-serif;font-weight:500;transition:all .2s;white-space:nowrap;}
.sb:hover{color:var(--cream);}
.sb.on{color:var(--gold-light);border-bottom-color:var(--gold);}

/* CONTENT */
#content{flex:1;overflow:hidden;position:relative;}
.sec{display:none;height:100%;flex-direction:column;overflow:hidden;}
.sec.on{display:flex;}

/* TAB BAR */
.tbar{flex-shrink:0;display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 10px;border-bottom:1px solid var(--border);background:var(--dark);}
.tb{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Gopher',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tb:hover{border-color:var(--gold);color:var(--cream);}
.tb.on{background:var(--gold);border-color:var(--gold);color:var(--dark);font-weight:600;}

/* SECTION BODY */
.sbody{flex:1;overflow-y:auto;padding:20px 22px;}
.sbody::-webkit-scrollbar{width:4px;}
.sbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.tpane{display:none;}
.tpane.on{display:block;animation:fi .2s ease;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* LISTS */
.lcard{background:var(--dark2);border:1px solid var(--border);border-radius:14px;padding:18px;}
.arow{display:flex;gap:8px;margin-bottom:14px;}
.ainp{flex:1;background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--cream);font-family:'Gopher',sans-serif;font-size:12px;outline:none;transition:border-color .2s;}
.ainp:focus{border-color:var(--gold);}
.ainp::placeholder{color:var(--muted);}
.abtn{background:var(--gold);border:none;border-radius:8px;padding:9px 16px;color:var(--dark);font-size:18px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Gopher',sans-serif;}
.abtn:hover{background:var(--gold-light);}
.iwrap{max-height:340px;overflow-y:auto;}
.iwrap::-webkit-scrollbar{width:3px;}
.iwrap::-webkit-scrollbar-thumb{background:var(--border);}
.empty{color:var(--muted);font-size:11px;letter-spacing:1px;padding:10px 0;}
.ti{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(201,168,76,.07);}
.ti:last-child{border-bottom:none;}
.tc{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gold);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.tc:hover{background:rgba(201,168,76,.2);}
.tc.done{background:var(--gold);}
.tc.done::after{content:"✓";font-size:10px;color:var(--dark);font-weight:700;}
.tt{flex:1;font-size:12px;line-height:1.5;word-break:break-word;}
.tt.done{text-decoration:line-through;color:var(--muted);opacity:.65;}
.td{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;opacity:0;transition:opacity .2s,color .2s;flex-shrink:0;padding:0 2px;}
.ti:hover .td{opacity:1;}
.td:hover{color:#e07070;}
.gi{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(201,168,76,.07);}
.gi:last-child{border-bottom:none;}
.gc{width:19px;height:19px;border-radius:4px;border:1.5px solid var(--gold);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.gc.done{background:var(--gold);}
.gc.done::after{content:"✓";font-size:11px;color:var(--dark);font-weight:700;}
.gt{flex:1;font-size:12px;line-height:1.5;}
.gt.done{text-decoration:line-through;color:var(--muted);}
.gd{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;opacity:0;transition:opacity .2s,color .2s;}
.gi:hover .gd{opacity:1;}
.gd:hover{color:#e07070;}

/* CALENDAR */
#cal-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
#cal-lbl{font-size:20px;letter-spacing:2px;flex:1;font-weight:400;}
.cnav{background:var(--dark2);border:1px solid var(--border);color:var(--gold);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:16px;}
#cal-connect{background:linear-gradient(135deg,var(--gold-dark),var(--gold));border:none;border-radius:20px;padding:7px 16px;color:var(--dark);font-size:9px;font-weight:600;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;font-family:'Gopher',sans-serif;}
#cal-connect.connected{background:#2a5a2a;color:#90d090;cursor:default;}
#cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cdow{text-align:center;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);padding:8px 0;font-weight:600;}
.cday{min-height:70px;border-radius:7px;background:var(--dark2);border:1px solid var(--border);padding:5px;font-size:10px;color:var(--muted);overflow:hidden;}
.cday.today{border-color:var(--gold);background:rgba(201,168,76,.07);color:var(--gold-light);}
.cday.other{opacity:.28;}
.cdn{font-weight:600;font-size:11px;margin-bottom:2px;}
.cev{font-size:8px;padding:2px 4px;border-radius:3px;margin-top:2px;background:rgba(201,168,76,.18);color:var(--gold-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cev.pers{background:rgba(140,90,200,.25);color:#c8a0e8;}
#cal-info{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:12px;}

/* CLAUDE */
#cwrap{display:flex;flex-direction:column;height:100%;}
#cmsgs{flex:1;overflow-y:auto;padding:4px 0 12px;display:flex;flex-direction:column;gap:10px;}
#cmsgs::-webkit-scrollbar{width:4px;}
#cmsgs::-webkit-scrollbar-thumb{background:var(--border);}
.msg{max-width:80%;padding:11px 15px;border-radius:14px;font-size:13px;line-height:1.6;}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:var(--dark);border-radius:14px 14px 4px 14px;font-weight:500;}
.msg.a{align-self:flex-start;background:var(--dark2);border:1px solid var(--border);border-radius:14px 14px 14px 4px;}
.msg.t{align-self:flex-start;background:var(--dark2);border:1px solid var(--border);color:var(--muted);font-size:12px;font-style:italic;}
#cinrow{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border);flex-shrink:0;}
#cinp{flex:1;background:var(--dark2);border:1px solid var(--border);border-radius:24px;padding:11px 16px;color:var(--cream);font-family:'Gopher',sans-serif;font-size:13px;outline:none;resize:none;max-height:90px;transition:border-color .2s;}
#cinp:focus{border-color:var(--gold);}
#csend{background:linear-gradient(135deg,var(--gold-dark),var(--gold));border:none;border-radius:24px;padding:11px 18px;color:var(--dark);font-size:16px;cursor:pointer;font-family:'Gopher',sans-serif;}

.stitle{font-size:22px;font-weight:400;letter-spacing:3px;margin-bottom:2px;}
.ssub{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:18px;}
</style>
</head>

        <button class="tb" onclick="goT('goals','tenyear',this)">10-Year Vision</button>
      </div>
      <div class="sbody">
        <div class="tpane on" id="goals-2026"></div>
        <div class="tpane" id="goals-2027"></div>
        <div class="tpane" id="goals-tenyear"></div>
      </div>
    </div>

    <!-- CLAUDE -->
    <div class="sec" id="sec-claude">
      <div class="sbody" style="display:flex;flex-direction:column;height:100%;padding-bottom:0;">
        <div class="stitle">Ask Claude</div>
        <div class="ssub">AI Assistant &middot; Schedule &middot; Update Lists</div>
        <div id="cwrap">
          <div id="cmsgs">
            <div class="msg a">Hi Amantha &#10022; I'm here to help — schedule meetings, update your lists, plan your businesses, and more. What do you need?</div>
          </div>
          <div id="cinrow">
            <textarea id="cinp" rows="1" placeholder="Add to grocery list&hellip; Book a meeting Friday 2pm&hellip;"></textarea>
            <button id="csend" onclick="cSend()">&#10148;</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ═══ NO EXTERNAL DEPENDENCIES — RUNS INSTANTLY ═══

const PIN = '1234';
let pin = '';

// PIN
function pp(v) {
  if (v==='c') pin='';
  else if (v==='d') pin=pin.slice(0,-1);
  else if (pin.length<4) pin+=v;
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('on', i<pin.length);
  if (pin.length===4) {
    if (pin===PIN) {
      document.getElementById('splash').classList.add('hide');
      initApp();
    } else {
      document.getElementById('pin-err').textContent='Incorrect PIN';
      pin='';
      for(let i=0;i<4;i++) document.getElementById('d'+i).classList.remove('on');
      setTimeout(()=>document.getElementById('pin-err').textContent='',1500);
    }
  }
}

// DATE
function tick(){
  document.getElementById('tb-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();
}

// SECTION NAV
function goS(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));
  document.getElementById('sec-'+id)?.classList.add('on');
  document.getElementById('sb-'+id)?.classList.add('on');
}

// TAB NAV
function goT(sec,tab,btn){
  const s=document.getElementById('sec-'+sec);
  s?.querySelectorAll('.tpane').forEach(p=>p.classList.remove('on'));
  s?.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  document.getElementById(sec+'-'+tab)?.classList.add('on');
  if(btn) btn.classList.add('on');
}

// LISTS — localStorage only, no external deps
const LISTS=[
  {id:'personal-day',goal:false},{id:'personal-week',goal:false},{id:'personal-month',goal:false},
  {id:'family-iman',goal:false},{id:'family-akina',goal:false},{id:'family-chris',goal:false},
  {id:'family-grocery',goal:false},{id:'family-home',goal:false},{id:'family-projects',goal:false},
  {id:'business-lash',goal:false},{id:'business-bu',goal:false},{id:'business-glam',goal:false},
  {id:'business-meetings',goal:false},{id:'business-content',goal:false},
  {id:'goals-2026',goal:true},{id:'goals-2027',goal:true},{id:'goals-tenyear',goal:true}
];
const D={};

function loadAll(){
  LISTS.forEach(def=>{
    try{D[def.id]=JSON.parse(localStorage.getItem('cc2_'+def.id)||'[]');}catch(e){D[def.id]=[];}
    const el=document.getElementById(def.id);
    if(!el) return;
    el.innerHTML=buildUI(def);
    render(def);
  });
}

function buildUI(def){
  return `<div class="lcard">
    <div class="arow">
      <input class="ainp" id="inp-${def.id}" placeholder="${def.goal?'Add a goal…':'Add item…'}" onkeydown="if(event.key==='Enter')add('${def.id}')"/>
      <button class="abtn" onclick="add('${def.id}')">+</button>
    </div>
    <div class="iwrap" id="items-${def.id}"></div>
  </div>`;
}

function render(def){
  const el=document.getElementById('items-'+def.id);
  if(!el) return;
  const items=D[def.id]||[];
  if(!items.length){el.innerHTML='<div class="empty">Nothing yet — add something ✦</div>';return;}
  el.innerHTML=items.map((item,i)=>def.goal?`
    <div class="gi">
      <div class="gc ${item.done?'done':''}" onclick="tog('${def.id}',${i})"></div>
      <div class="gt ${item.done?'done':''}">${x(item.text)}</div>
      <button class="gd" onclick="del('${def.id}',${i})">&#10005;</button>
    </div>`:`
    <div class="ti">
      <div class="tc ${item.done?'done':''}" onclick="tog('${def.id}',${i})"></div>
      <div class="tt ${item.done?'done':''}">${x(item.text)}</div>
      <button class="td" onclick="del('${def.id}',${i})">&#10005;</button>
    </div>`).join('');
}

function add(id){
  const inp=document.getElementById('inp-'+id);
  const t=inp?.value.trim();if(!t)return;
  const items=D[id]||[];items.push({text:t,done:false});
  save(id,items);inp.value='';
}
function tog(id,i){const items=D[id]||[];if(items[i])items[i].done=!items[i].done;save(id,items);}
function del(id,i){const items=D[id]||[];items.splice(i,1);save(id,items);}
function save(id,items){
  D[id]=items;
  try{localStorage.setItem('cc2_'+id,JSON.stringify(items));}catch(e){}
  const def=LISTS.find(d=>d.id===id);
  if(def)render(def);
}
function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// CALENDAR — loads Google API dynamically, non-blocking
const CID='291402599329-naosn2fhptrhgt0pp5a79sqhrehg7qjm.apps.googleusercontent.com';
const CAPIKEY='AIzaSyAQhzDQyK1MTk0hnUDuNRYduV6CzM6jKMk';
const CSCOPES='https://www.googleapis.com/auth/calendar.readonly';
const CALS=['mshood@lashlabpdx.com','amanthahood@gmail.com'];
let cTok='',cYear,cMonth,cReady=false,cTokenClient;

function initCal(){
  const now=new Date();cYear=now.getFullYear();cMonth=now.getMonth();
  renderGrid([]);
  // Load scripts dynamically so they never block the app
  const s1=document.createElement('script');
  s1.src='https://apis.google.com/js/api.js';
  s1.onload=()=>{
    gapi.load('client',async()=>{
      await gapi.client.init({apiKey:CAPIKEY,discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest']});
      cReady=true;
      // Now load GIS
      const s2=document.createElement('script');
      s2.src='https://accounts.google.com/gsi/client';
      s2.onload=()=>{
        cTokenClient=google.accounts.oauth2.initTokenClient({
          client_id:CID,scope:CSCOPES,
          callback:(resp)=>{
            if(resp.error){console.warn(resp);return;}
            cTok=resp.access_token;
            try{localStorage.setItem('ctok',cTok);localStorage.setItem('ctok_exp',Date.now()+55*60*1000);}catch(e){}
            markCal();fetchEvents();
          }
        });
        // Try saved token
        try{
          const t=localStorage.getItem('ctok'),e=parseInt(localStorage.getItem('ctok_exp')||'0');
          if(t&&Date.now()<e){cTok=t;gapi.client.setToken({access_token:cTok});markCal();fetchEvents();return;}
        }catch(e){}
        // Try silent
        try{cTokenClient.requestAccessToken({prompt:''});}catch(e){}
      };
      document.head.appendChild(s2);
    });
  };
  document.head.appendChild(s1);
}

function calAuth(){
  if(!cReady||!cTokenClient){
    document.getElementById('cal-connect').textContent='Loading...';
    setTimeout(calAuth,1000);return;
  }
  cTokenClient.requestAccessToken({prompt:'select_account'});
}

function markCal(){
  const b=document.getElementById('cal-connect');
  b.textContent='✓ Connected';b.classList.add('connected');b.onclick=null;
  document.getElementById('cal-info').textContent='Showing both calendars — Lash Lab (gold) & Personal (purple)';
}

function calNav(d){cMonth+=d;if(cMonth>11){cMonth=0;cYear++;}if(cMonth<0){cMonth=11;cYear--;}fetchEvents();}

async function fetchEvents(){
  if(!cTok){renderGrid([]);return;}
  gapi.client.setToken({access_token:cTok});
  const s=new Date(cYear,cMonth,1).toISOString(),e=new Date(cYear,cMonth+1,1).toISOString();
  try{
    const all=await Promise.all(CALS.map(id=>
      gapi.client.calendar.events.list({calendarId:id,timeMin:s,timeMax:e,singleEvents:true,orderBy:'startTime',maxResults:100})
        .then(r=>r.result.items.map(ev=>({...ev,_c:id}))).catch(()=>[])));
    renderGrid(all.flat());
  }catch(e){renderGrid([]);}
}

function renderGrid(events){
  const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-lbl').textContent=MO[cMonth]+' '+cYear;
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let h=dows.map(d=>`<div class="cdow">${d}</div>`).join('');
  const first=new Date(cYear,cMonth,1).getDay();
  const dim=new Date(cYear,cMonth+1,0).getDate();
  const pd=new Date(cYear,cMonth,0).getDate();
  const today=new Date();
  for(let i=first-1;i>=0;i--)h+=`<div class="cday other"><div class="cdn">${pd-i}</div></div>`;
  for(let d=1;d<=dim;d++){
    const isT=today.getFullYear()===cYear&&today.getMonth()===cMonth&&today.getDate()===d;
    const evs=events.filter(e=>{const dt=e.start?.dateTime||e.start?.date;if(!dt)return false;const ed=new Date(dt);return ed.getFullYear()===cYear&&ed.getMonth()===cMonth&&ed.getDate()===d;});
    const eh=evs.slice(0,3).map(e=>`<div class="cev ${e._c==='amanthahood@gmail.com'?'pers':''}">${x(e.summary||'(no title)')}</div>`).join('');
    h+=`<div class="cday${isT?' today':''}"><div class="cdn">${d}</div>${eh}</div>`;
  }
  const rem=(7-(first+dim)%7)%7;
  for(let i=1;i<=rem;i++)h+=`<div class="cday other"><div class="cdn">${i}</div></div>`;
  document.getElementById('cal-grid').innerHTML=h;
}

// CLAUDE
let hist=[];
async function cSend(){
  const inp=document.getElementById('cinp');
  const t=inp.value.trim();if(!t)return;
  inp.value='';addMsg('u',t);hist.push({role:'user',content:t});
  const th=addMsg('t','✦ Thinking…');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        system:"You are Amantha Hood's Command Center AI. She owns Lash Lab PDX, Glam Lab PDX, Beauty University PDX in Portland OR. Fiancé Chris, daughters Iman & Akina. Be direct and concise.",
        messages:hist.slice(-20)
      })
    });
    const data=await r.json();
    const reply=data.content?.[0]?.text||'Sorry, try again.';
    th.remove();addMsg('a',reply);hist.push({role:'assistant',content:reply});
  }catch(e){th.remove();addMsg('a','Connection issue — try again.');}
}
function addMsg(cls,txt){
  const el=document.createElement('div');el.className='msg '+cls;el.textContent=txt;
  const m=document.getElementById('cmsgs');m.appendChild(el);m.scrollTop=m.scrollHeight;return el;
}
document.getElementById('cinp')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();cSend();}});

// INIT — runs after PIN, zero external deps
function initApp(){
  tick();setInterval(tick,60000);
  loadAll();
  initCal();
}
</script>
</body>
</html>
